name: Multi-env-chat-app-BE

on:
  workflow_dispatch:

permissions:
  contents: read

# ============================================================================
# JOB 1
# Resolve environment from the GitHub branch
#
# Branch mapping:
#   release/development -> release/development
#   hotfix/*            -> release/development 
#   release/stage       -> release/stage
#   release/uat         -> release/uat
#   main                -> main
#
# No branch input.
# No environment input.
# ============================================================================

jobs:

  resolve-environment:

    name: Resolve deployment environment

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}

    steps:

      # ----------------------------------------------------------------------
      # Resolve environment from branch
      # ----------------------------------------------------------------------

      - name: Resolve environment from branch
        id: resolve
        shell: bash

        env:
          BRANCH: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          echo "GitHub branch: $BRANCH"

          case "$BRANCH" in

            release/development)
              ENVIRONMENT="dev"
              ;;

            hotfix/*)
              ENVIRONMENT="dev"
              ;;

            release/stage)
              ENVIRONMENT="sit"
              ;;

            release/uat)
              ENVIRONMENT="uat"
              ;;

            main)
              ENVIRONMENT="prod"
              ;;

            *)
              echo "::error::Branch '$BRANCH' is not allowed for deployment."
              echo "::error::Allowed branches:"
              echo "::error::  release/development"
              echo "::error::  hotfix/*"
              echo "::error::  release/stage"
              echo "::error::  release/uat"
              echo "::error::  main"
              exit 1
              ;;

          esac

          echo "=========================================="
          echo "Deployment Resolution"
          echo "=========================================="
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


# ============================================================================
# JOB 2
# Build and deploy ECS application
# ============================================================================

  deploy:

    name: Deploy ECS to ${{ needs.resolve-environment.outputs.environment }}

    needs:
      - resolve-environment

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    # ------------------------------------------------------------------------
    # GitHub Environment
    #
    # Environment is automatically resolved from the branch.
    #
    # release/development    -> GitHub Environment: dev
    # hotfix/*               -> GitHub Environment: dev
    # release/stage          -> GitHub Environment: sit
    # release/uat            -> GitHub Environment: uat
    # main                   -> GitHub Environment: prod
    #
    # Configure required reviewers for prod under:
    # Repository -> Settings -> Environments -> prod
    # ------------------------------------------------------------------------

    environment:
      name: ${{ needs.resolve-environment.outputs.environment }}

    # ------------------------------------------------------------------------
    # Prevent simultaneous deployments to the same environment.
    # ------------------------------------------------------------------------

    concurrency:
      group: ecs-deployment-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:

      # ======================================================================
      # DEPLOYMENT INFORMATION
      # ======================================================================

      - name: Deployment information
        shell: bash

        env:
          BRANCH: ${{ needs.resolve-environment.outputs.branch }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

        run: |
          echo "=========================================="
          echo "Deployment Information"
          echo "=========================================="
          echo "Repository  : $GITHUB_REPOSITORY"
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="


      # ======================================================================
      # VALIDATE REQUIRED CONFIGURATION
      # ======================================================================
      - name: Validate required configuration
        shell: bash
        env:
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
        run: |
          set -euo pipefail

          missing=0

          check() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::Missing required variable '$name' for environment '$TARGET_ENV'"
              missing=1
            fi
          }

          echo "Validating AWS/ECS configuration..."

          check "AWS_REGION"                  "${{ vars.AWS_REGION }}"
          check "ECS_CLUSTER"                 "${{ vars.ECS_CLUSTER }}"
          check "ECS_SERVICE"                 "${{ vars.ECS_SERVICE }}"
          check "ECS_CONTAINER_NAME"          "${{ vars.ECS_CONTAINER_NAME }}"
          check "ECS_TASK_DEFINITION_FAMILY"  "${{ vars.ECS_TASK_DEFINITION_FAMILY }}"
          check "ECR_REPOSITORY"              "${{ vars.ECR_REPOSITORY }}"
          check "AWS_ROLE_ARN"                "${{ secrets.AWS_ROLE_ARN }}"
          
          echo "Validating application configuration..."
          
          check "TENANT_ID"               "${{ VARS.TENANT_ID }}"
          check "CLIENT_ID"               "${{ VARS.CLIENT_ID }}"
          check "API_SCOPES"              "${{ VARS.API_SCOPES }}"
          check "SECRET_NAME"             "${{ VARS.SECRET_NAME }}"
          check "CHAT_FE_URL"             "${{ VARS.CHAT_FE_URL }}"
          check "GUARDRAIL_IDENTIFIER"    "${{ VARS.GUARDRAIL_IDENTIFIER }}"
          check "GUARDRAIL_VERSION"       "${{ VARS.GUARDRAIL_VERSION }}"
          check "OPENSEARCH_ENDPOINT"     "${{ VARS.OPENSEARCH_ENDPOINT }}"
          check "EMBEDDING_MODEL_ID"      "${{ VARS.EMBEDDING_MODEL_ID }}"
          check "TEXT_MODEL_ID"           "${{ VARS.TEXT_MODEL_ID }}"
          check "TEXT_MODEL_VERSION"      "${{ VARS.TEXT_MODEL_VERSION }}"
          check "OPENSEARCH_INDEX_NAME"   "${{ VARS.OPENSEARCH_INDEX_NAME }}"
          check "LIBRARY_FILTER_KEY_NAME" "${{ VARS.LIBRARY_FILTER_KEY_NAME }}"
          check "CHAT_FE_CLIENT_ID"       "${{ VARS.CHAT_FE_CLIENT_ID }}"
          check "TRANSCRIBE_ROLE"         "${{ VARS.TRANSCRIBE_ROLE }}"
          check "CAL_ENV"                 "${{ vars.CAL_ENV }}"
          check "HOSPITAL_NAMES"          "${{ VARS.HOSPITAL_NAMES }}"
          check "SHAREPOINT_URI"          "${{ VARS.SHAREPOINT_URI }}"
          check "DB_TABLE_NAME_PREFIX"    "${{ vars.DB_TABLE_NAME_PREFIX }}"
       
          # Environment-specific configuration
          case "$TARGET_ENV" in
            dev)
              check "DEV_ENV_SPECIFIC_VALUE" "${{ vars.DEV_ENV_SPECIFIC_VALUE }}"
              ;;
            sit)
              check "SIT_ENV_SPECIFIC_VALUE" "${{ vars.SIT_ENV_SPECIFIC_VALUE }}"
              ;;
            uat)
              check "UAT_ENV_SPECIFIC_VALUE" "${{ vars.UAT_ENV_SPECIFIC_VALUE }}"
              ;;
            prod)
              check "PROD_ENV_SPECIFIC_VALUE" "${{ vars.PROD_ENV_SPECIFIC_VALUE }}"
              ;;
            *)
              echo "::error::Unknown environment '$TARGET_ENV'"
              missing=1
              ;;
          esac

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Required configuration validation failed."
            exit 1
          fi

          echo "All required configuration values are present."

      # ======================================================================
      # Checkout selected branch
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-environment.outputs.branch }}
          fetch-depth: 0
     
      # ======================================================================
      # UPDATE APPSETTINGS
      # ======================================================================
      - name: Update appsettings.json
        shell: bash
        env:

          TENANT_ID:               ${{ VARS.TENANT_ID }}
          CLIENT_ID:               ${{ VARS.CLIENT_ID }}
          API_SCOPES:              ${{ VARS.API_SCOPES }}
          AWS_REGION:              ${{ VARS.AWS_REGION }}
          SECRET_NAME:             ${{ vars.SECRET_NAME }}
          CHAT_FE_URL:             ${{ VARS.CHAT_FE_URL }}
          GUARDRAIL_IDENTIFIER:    ${{ VARS.GUARDRAIL_IDENTIFIER }}
          GUARDRAIL_VERSION:       ${{ VARS.GUARDRAIL_VERSION }}
          OPENSEARCH_ENDPOINT:     ${{ VARS.OPENSEARCH_ENDPOINT }}
          EMBEDDING_MODEL_ID:      ${{ VARS.EMBEDDING_MODEL_ID }}
          TEXT_MODEL_ID:           ${{ VARS.TEXT_MODEL_ID }}
          TEXT_MODEL_VERSION:      ${{ VARS.TEXT_MODEL_VERSION }}
          OPENSEARCH_INDEX_NAME:   ${{ VARS.OPENSEARCH_INDEX_NAME }}
          LIBRARY_FILTER_KEY_NAME: ${{ VARS.LIBRARY_FILTER_KEY_NAME }}
          CHAT_FE_CLIENT_ID:       ${{ VARS.CHAT_FE_CLIENT_ID }}
          TRANSCRIBE_ROLE:         ${{ VARS.TRANSCRIBE_ROLE }}
          CAL_ENV:                 ${{ vars.CAL_ENV }}
          HOSPITAL_NAMES:          ${{ VARS.HOSPITAL_NAMES }}
          SHAREPOINT_URI:          ${{ VARS.SHAREPOINT_URI }}
          DB_TABLE_NAME_PREFIX:    ${{ vars.DB_TABLE_NAME_PREFIX }}

        run: |
          set -euo pipefail

          test -f ./Backend/webapi/appsettings.json

          jq \
            --arg TENANT_ID "$TENANT_ID" \
            --arg CLIENT_ID "$CLIENT_ID" \
            --arg API_SCOPES "$API_SCOPES" \
            --arg REGION "$AWS_REGION" \
            --arg SECRET_NAME "$SECRET_NAME" \
            --arg CHAT_FE_URL "$CHAT_FE_URL" \
            --arg GUARDRAIL_IDENTIFIER "$GUARDRAIL_IDENTIFIER" \
            --arg GUARDRAIL_VERSION "$GUARDRAIL_VERSION" \
            --arg OPENSEARCH_ENDPOINT "$OPENSEARCH_ENDPOINT" \
            --arg EMBEDDING_MODEL_ID "$EMBEDDING_MODEL_ID" \
            --arg TEXT_MODEL_ID "$TEXT_MODEL_ID" \
            --arg TEXT_MODEL_VERSION "$TEXT_MODEL_VERSION" \
            --arg OPENSEARCH_INDEX_NAME "$OPENSEARCH_INDEX_NAME" \
            --arg LIBRARY_FILTER_KEY_NAME "$LIBRARY_FILTER_KEY_NAME" \
            --arg CHAT_FE_CLIENT_ID "$CHAT_FE_CLIENT_ID" \
            --arg TRANSCRIBE_ROLE "$TRANSCRIBE_ROLE" \
            --arg CAL_ENV "$CAL_ENV" \
            --arg HOSPITAL_NAMES "$HOSPITAL_NAMES" \
            --arg SHAREPOINT_URI "$SHAREPOINT_URI" \
            --arg DB_TABLE_NAME_PREFIX  "$DB_TABLE_NAME_PREFIX" \
            '
            .Authentication.AzureAd.TenantId = $TENANT_ID
            | .Authentication.AzureAd.ClientId = $CLIENT_ID
            | .Authentication.AzureAd.Scopes = $API_SCOPES
            | .AWS.Region = $REGION
            | .AWS.SecretName = $SECRET_NAME
            | .AllowedOrigins = $CHAT_FE_URL
            | .KernelMemory.Services.GuardRail.Identifier = $GUARDRAIL_IDENTIFIER
            | .KernelMemory.Services.GuardRail.Version = $GUARDRAIL_VERSION
            | .OpenSearch.Endpoint = $OPENSEARCH_ENDPOINT
            | .OpenSearch.EmbeddingModelId = $EMBEDDING_MODEL_ID
            | .OpenSearch.TextModelId = $TEXT_MODEL_ID
            | .OpenSearch.TextModelVersion = $TEXT_MODEL_VERSION
            | .OpenSearch.IndexName = $OPENSEARCH_INDEX_NAME
            | .OpenSearch.LibraryFilterKeyName = $LIBRARY_FILTER_KEY_NAME
            | .Frontend.AadClientId = $CHAT_FE_CLIENT_ID
            | .AWS.TranscribeRole = $TRANSCRIBE_ROLE
            | .Hospitals.HospitalNames = $HOSPITAL_NAMES
            | .Prompts.SystemDescription|=gsub("_SHAREPOINT_SOURCE_URL_"; $SHAREPOINT_URI
            | .CDAEnvironment = $CAL_ENV
            | .Database.TableNamePrefix = $DB_TABLE_NAME_PREFIX
            ' \
            ./Backend/webapi/appsettings.json \
            > ./Backend/webapi/appsettings.tmp.json

          mv ./Backend/webapi/appsettings.tmp.json ./Backend/webapi/appsettings.json

      # ======================================================================
      # VERIFY APPSETTINGS
      # ======================================================================

      - name: Verify appsettings.json
        shell: bash

        run: |
          set -euo pipefail

          jq empty ./Backend/webapi/appsettings.json

          cat ./Backend/webapi/appsettings.json

          echo "appsettings.json is valid JSON.."


      # ======================================================================
      # GET COMMIT HASH
      # ======================================================================

      - name: Get commit hash
        id: commit
        shell: bash

        run: |
          set -euo pipefail

          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Commit SHA : $COMMIT_SHA"
          echo "Short SHA  : $SHORT_SHA"

      # ======================================================================
      # CONFIGURE AWS CREDENTIALS USING GITHUB OIDC
      # ======================================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ======================================================================
      # LOGIN TO AMAZON ECR
      # ======================================================================

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================================
      # BUILD AND PUSH DOCKER IMAGE
      # ======================================================================
      - name: Build, tag and push image to Amazon ECR
        id: build-image
        shell: bash

        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHORT_SHA: ${{ steps.commit.outputs.short_sha }}
          
        run: |
          set -euo pipefail

          REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_TAG="${SHORT_SHA}"

          echo "Repository : $REPOSITORY_URI"
          echo "Image tag  : $IMAGE_TAG, latest"

          # Build backend image
          # docker build \
          #  -t "$REPOSITORY_URI:$IMAGE_TAG" \
          #  -t "$REPOSITORY_URI:latest" \
          #  ./Backend/

          # Build 
          docker build \
            -t "$REPOSITORY_URI:$IMAGE_TAG" \
            -t "$REPOSITORY_URI:latest" .

          # Push the commit tag first, then move "latest" to this image
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"

          # Get immutable ECR digest
          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Unable to resolve ECR image digest."
            exit 1
          fi

          IMAGE_URI="${REPOSITORY_URI}@${IMAGE_DIGEST}"

          echo "Immutable image URI:"
          echo "$IMAGE_URI"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"


      # ======================================================================
      # DOWNLOAD CURRENT ECS TASK DEFINITION
      # ======================================================================

      - name: Download ECS task definition
        shell: bash
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}

        run: |
          set -euo pipefail

          # Task definition the service is actually using (its desired/PRIMARY deployment).
          CURRENT_TASK_DEF_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [[ -z "$CURRENT_TASK_DEF_ARN" || "$CURRENT_TASK_DEF_ARN" == "None" ]]; then
            echo "::error::Unable to resolve the task definition for service '$ECS_SERVICE' in cluster '$ECS_CLUSTER'."
            exit 1
          fi

          # Sanity check: the service must belong to the expected family.
          if [[ "$CURRENT_TASK_DEF_ARN" != *":task-definition/${ECS_TASK_DEFINITION_FAMILY}:"* ]]; then
            echo "::error::Service is running '$CURRENT_TASK_DEF_ARN', which is not in family '$ECS_TASK_DEFINITION_FAMILY'."
            exit 1
          fi

          echo "Service is running: $CURRENT_TASK_DEF_ARN"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF_ARN" \
            --query "taskDefinition" \
            --output json \
            > task-definition.json

          test -s task-definition.json

          echo "Task definition downloaded successfully."

      # ======================================================================
      # UPDATE CONTAINER IMAGE IN TASK DEFINITION
      # ======================================================================

      - name: Update ECS container image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image_uri }}


      # ======================================================================
      # DEPLOY TO ECS
      # ======================================================================

      - name: Deploy ECS service
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true


      # ======================================================================
      # DEPLOYMENT SUMMARY
      # ======================================================================

      - name: Deployment summary
        shell: bash

        env:
          BRANCH: ${{ needs.resolve-environment.outputs.branch }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
          IMAGE_TAG: ${{ steps.build-image.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.image_digest }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}

        run: |
          {
            echo "## ECS Deployment"
            echo ""
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Deployment: **successful**"
          } >> "$GITHUB_STEP_SUMMARY"
name: Multi-env-notes-app-FE

on:
  workflow_dispatch:

permissions:
  contents: read

# ============================================================================
# JOB 1
# Resolve environment from the GitHub branch
#
# Branch mapping:
#   release/development -> release/development
#   hotfix/*            -> release/development 
#   release/stage       -> release/stage
#   release/uat         -> release/uat
#   main                -> main
#
# No branch input.
# No environment input.
# ============================================================================

jobs:

  resolve-environment:

    name: Resolve deployment environment

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}

    steps:

      # ----------------------------------------------------------------------
      # Resolve environment from branch
      # ----------------------------------------------------------------------

      - name: Resolve environment from branch
        id: resolve
        shell: bash

        env:
          BRANCH: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          echo "GitHub branch: $BRANCH"

          case "$BRANCH" in

            release/development)
              ENVIRONMENT="dev"
              ;;

            hotfix/*)
              ENVIRONMENT="dev"
              ;;

            release/stage)
              ENVIRONMENT="sit"
              ;;

            release/uat)
              ENVIRONMENT="uat"
              ;;

            main)
              ENVIRONMENT="prod"
              ;;

            *)
              echo "::error::Branch '$BRANCH' is not allowed for deployment."
              echo "::error::Allowed branches:"
              echo "::error::  release/development"
              echo "::error::  hotfix/*"
              echo "::error::  release/stage"
              echo "::error::  release/uat"
              echo "::error::  main"
              exit 1
              ;;

          esac

          echo "=========================================="
          echo "Deployment Resolution"
          echo "=========================================="
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"


# ============================================================================
# JOB 2
# Build and deploy ECS application
# ============================================================================

  deploy:

    name: Deploy ECS to ${{ needs.resolve-environment.outputs.environment }}

    needs:
      - resolve-environment

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    # ------------------------------------------------------------------------
    # GitHub Environment
    #
    # Environment is automatically resolved from the branch.
    #
    # release/development    -> GitHub Environment: dev
    # hotfix/*               -> GitHub Environment: dev
    # release/stage          -> GitHub Environment: sit
    # release/uat            -> GitHub Environment: uat
    # main                   -> GitHub Environment: prod
    #
    # Configure required reviewers for prod under:
    # Repository -> Settings -> Environments -> prod
    # ------------------------------------------------------------------------

    environment:
      name: ${{ needs.resolve-environment.outputs.environment }}

    # ------------------------------------------------------------------------
    # Prevent simultaneous deployments to the same environment.
    # ------------------------------------------------------------------------

    concurrency:
      group: ecs-deployment-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:

      # ======================================================================
      # DEPLOYMENT INFORMATION
      # ======================================================================

      - name: Deployment information
        shell: bash

        env:
          BRANCH: ${{ needs.resolve-environment.outputs.branch }}
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

        run: |
          echo "=========================================="
          echo "Deployment Information"
          echo "=========================================="
          echo "Repository  : $GITHUB_REPOSITORY"
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="


      # ======================================================================
      # VALIDATE REQUIRED CONFIGURATION
      # ======================================================================
      - name: Validate required configuration
        shell: bash
        env:
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
        run: |
          set -euo pipefail

          missing=0

          check() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::Missing required variable '$name' for environment '$TARGET_ENV'"
              missing=1
            fi
          }

          echo "Validating AWS/ECS configuration..."
          check "AWS_REGION"                  "${{ vars.AWS_REGION }}"
          check "ECS_CLUSTER"                 "${{ vars.ECS_CLUSTER }}"
          check "ECS_SERVICE"                 "${{ vars.ECS_SERVICE }}"
          check "ECS_CONTAINER_NAME"          "${{ vars.ECS_CONTAINER_NAME }}"
          check "ECS_TASK_DEFINITION_FAMILY"  "${{ vars.ECS_TASK_DEFINITION_FAMILY }}"
          check "ECR_REPOSITORY"              "${{ vars.ECR_REPOSITORY }}"
          check "AWS_ROLE_ARN"                "${{ secrets.AWS_ROLE_ARN }}"

          echo "Validating App values configuration..."

          check "CLIENT_ID"                    "${{ vars.CLIENT_ID }}"
          check "TENANT_ID"                    "${{ vars.TENANT_ID}}"
          check "API_SCOPES"                   "${{ vars.API_SCOPES }}"
          check "NOTES_BE_API"                 "${{ vars.NOTES_BE_API }}"
          check "PORTAL_FE_URL"                "${{ vars.PORTAL_FE_URL}}"
          check "PORTAL_BE_API"                "${{ vars.PORTAL_BE_API }}"
     
          # Environment-specific configuration.
          case "$TARGET_ENV" in

            prod)
              check "PROD_Env_specific_value"   "${{ vars.PROD_ENV_SPECIFIC_VALUE }}"
              ;;

            dev)
              check "dev_Env_specific_value"    "${{ vars.DEV_ENV_SPECIFIC_VALUE }}"
              
              ;;

            sit)
              check "sit_Env_specific_value"   "${{ vars.sit_ENV_SPECIFIC_VALUE }}"
              ;;

            uat)
              check "uat_Env_specific_value"    "${{ vars.UAT_ENV_SPECIFIC_VALUE }}"
              ;;

            *)
              echo "::error::Unknown environment '$TARGET_ENV'."
              missing=1
              ;;

          esac

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::One or more required configuration values are missing."
            exit 1
          fi

          echo "All required configuration values are present."


      # ======================================================================
      # Checkout selected branch
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

        with:
          ref: ${{ needs.resolve-environment.outputs.branch }}
          fetch-depth: 0

      # ======================================================================
      # Render frontend .env
      #
      # IMPORTANT:
      # Values placed into a frontend build become publicly accessible.
      # Do NOT place passwords, client secrets, API keys or other secrets here.
      # ======================================================================
      - name: Render frontend .env
        shell: bash

        env:
          CLIENT_ID:            ${{ vars.CLIENT_ID }}
          TENANT_ID:            ${{ vars.TENANT_ID }}
          API_SCOPES:           ${{ vars.API_SCOPES }}
          NOTES_BE_API:         ${{ vars.NOTES_BE_API }}
          PORTAL_FE_URL:        ${{ vars.PORTAL_FE_URL}}
          PORTAL_BE_API:        ${{ vars.PORTAL_BE_API }}
          AWS_REGION:           ${{ vars.AWS_REGION }}
          
        run: |
          set -euo pipefail
         
          test -f ./frontend/.env.production
          
          envsubst \
            '${CLIENT_ID} ${TENANT_ID} ${API_SCOPES} ${PORTAL_FE_URL} ${NOTES_BE_API} ${PORTAL_BE_API} ${AWS_REGION}' \
            < ./frontend/.env.production \
            > /tmp/frontend.env

          mv /tmp/frontend.env ./frontend/.env.production


      # ======================================================================
      # Render nginx configuration
      # ======================================================================
      - name: Render nginx configuration
        shell: bash

        env:
          NOTES_BE_API:        ${{ vars.NOTES_BE_API }}
          PORTAL_FE_URL:       ${{ vars.PORTAL_FE_URL }}
          PORTAL_BE_API:       ${{ vars.PORTAL_BE_API}}
          
        run: |
          set -euo pipefail

          test -f ./frontend/nginx.conf

          export BACKEND_WS_URL="${NOTES_BE_API/https:/wss:}"
          envsubst \
           '${PORTAL_FE_URL} ${NOTES_BE_API} ${BACKEND_WS_URL} ${PORTAL_BE_API}' \
            < ./frontend/nginx.conf \
            > /tmp/nginx.conf

          mv /tmp/nginx.conf ./frontend/nginx.conf
      # ======================================================================
      # VERIFY APPSETTINGS
      # ======================================================================

      - name: Verify  config files
        shell: bash

        run: |
          set -euo pipefail
          
          echo "Valus nginx.conf."
          cat ./frontend/nginx.conf
          
          echo "Valus .env.production."
          cat ./frontend/.env.production
      # ======================================================================
      # Configure AWS credentials using GitHub OIDC
      # ======================================================================
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ======================================================================
      # Login to ECR
      # ======================================================================
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================================
      # Get source commit hash
      # ======================================================================
      - name: Get commit hash
        id: commit
        shell: bash

        run: |
          set -euo pipefail

          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          echo "Commit SHA : $COMMIT_SHA"
          echo "Short SHA  : $SHORT_SHA"
      # ======================================================================
      # Build and push Docker image
      # ======================================================================
      - name: Build, tag and push image to Amazon ECR
        id: build-image
        shell: bash

        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHORT_SHA: ${{ steps.commit.outputs.short_sha }}
          
        run: |
          set -euo pipefail

          REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          IMAGE_TAG="${SHORT_SHA}"

          echo "Repository : $REPOSITORY_URI"
          echo "Image tag  : $IMAGE_TAG, latest"

          # Build backend image
          # docker build \
          #  -t "$REPOSITORY_URI:$IMAGE_TAG" \
          #  -t "$REPOSITORY_URI:latest" \
          #  ./frontend/

          # Build 
          docker build \
            -t "$REPOSITORY_URI:$IMAGE_TAG" \
            -t "$REPOSITORY_URI:latest" .

          # Push the commit tag first, then move "latest" to this image
          docker push "$REPOSITORY_URI:$IMAGE_TAG"
          docker push "$REPOSITORY_URI:latest"

          # Resolve the immutable ECR digest.
          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Unable to resolve ECR image digest for '$IMAGE_TAG'."
            exit 1
          fi

          # Deploy using digest instead of mutable tag.
          IMAGE_URI="${REPOSITORY_URI}@${IMAGE_DIGEST}"

          echo "Immutable image URI: $IMAGE_URI"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # Download current ECS task definition
      # ======================================================================
      - name: Download current ECS task definition
        shell: bash

        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}

        run: |
          set -euo pipefail

          # Task definition the service is actually using (its desired/PRIMARY deployment).
          CURRENT_TASK_DEF_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [[ -z "$CURRENT_TASK_DEF_ARN" || "$CURRENT_TASK_DEF_ARN" == "None" ]]; then
            echo "::error::Unable to resolve the task definition for service '$ECS_SERVICE' in cluster '$ECS_CLUSTER'."
            exit 1
          fi

          # Sanity check: the service must belong to the expected family.
          if [[ "$CURRENT_TASK_DEF_ARN" != *":task-definition/${ECS_TASK_DEFINITION_FAMILY}:"* ]]; then
            echo "::error::Service is running '$CURRENT_TASK_DEF_ARN', which is not in family '$ECS_TASK_DEFINITION_FAMILY'."
            exit 1
          fi

          echo "Service is running: $CURRENT_TASK_DEF_ARN"

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEF_ARN" \
            --query "taskDefinition" \
            --output json \
            > task-definition.json

          test -s task-definition.json

          echo "Task definition downloaded successfully."


      # ======================================================================
      # Update only the specified container image.
      #
      # The container is identified by ECS_CONTAINER_NAME and its image is
      # replaced with the newly built immutable ECR image URI.
      # ======================================================================
      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image_uri }}

      # ======================================================================
      # Deploy updated ECS task definition
      # ======================================================================
      - name: Deploy new task definition to ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      # ======================================================================
      # Deployment summary
      # ======================================================================
      - name: Deployment summary
        shell: bash

        env:
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
          BRANCH: ${{ needs.resolve-environment.outputs.branch }}

        run: |
          {
            echo "## ECS Deployment"
            echo ""
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Deployment: successful"
          } >> "$GITHUB_STEP_SUMMARY"
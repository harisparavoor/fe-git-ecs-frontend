name: Multi-env-notes-app-FE

on:
  workflow_dispatch:

permissions:
  contents: read

# ============================================================================
# JOB 1
# Resolve environment from the GitHub branch
#
# Branch mapping:
#   release/development -> release/development
#   hotfix/*            -> release/development
#   release/stage       -> release/stage
#   release/uat         -> release/uat
#   main                -> main
#
# No branch input.
# No environment input.
# ============================================================================

jobs:
  resolve-environment:
    name: Resolve deployment environment

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}

    steps:
      # ----------------------------------------------------------------------
      # Resolve environment from branch
      # ----------------------------------------------------------------------

      - name: Resolve environment from branch
        id: resolve
        shell: bash

        env:
          BRANCH: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          echo "GitHub branch: $BRANCH"

          case "$BRANCH" in

            release/development)
              ENVIRONMENT="dev"
              ;;

            hotfix/*)
              ENVIRONMENT="dev"
              ;;

            release/stage)
              ENVIRONMENT="sit"
              ;;

            release/uat)
              ENVIRONMENT="uat"
              ;;

            main)
              ENVIRONMENT="prod"
              ;;

            *)
              echo "::error::Branch '$BRANCH' is not allowed for deployment."
              echo "::error::Allowed branches:"
              echo "::error::  release/development"
              echo "::error::  hotfix/*"
              echo "::error::  release/stage"
              echo "::error::  release/uat"
              echo "::error::  main"
              exit 1
              ;;

          esac

          echo "=========================================="
          echo "Deployment Resolution"
          echo "=========================================="
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

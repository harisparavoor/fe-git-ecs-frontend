name: multi-env-ecs-app-FE-v4

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

jobs:

  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-24.04

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}

    steps:

      - name: Resolve environment and branch
        id: resolve
        shell: bash

        env:
          TRIGGER_REF_NAME: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          BRANCH="$TRIGGER_REF_NAME"

          if [[ -z "$BRANCH" ]]; then
            echo "::error::Deployment branch could not be resolved."
            exit 1
          fi

          echo "Deployment branch: $BRANCH"

          # Validate branch
          case "$BRANCH" in
            dev|staging|uat|prod|hotfix/*)
              ;;
            *)
              echo "::error::Invalid branch name '$BRANCH'."
              echo "::error::Allowed branches: dev, staging, uat, prod, hotfix/*."
              exit 1
              ;;
          esac

          # Resolve GitHub Environment from branch
          case "$BRANCH" in
            dev)
              ENVIRONMENT="dev"
              ;;

            staging)
              ENVIRONMENT="staging"
              ;;

            uat)
              ENVIRONMENT="uat"
              ;;

            prod)
              ENVIRONMENT="prod"
              ;;

            hotfix/*)
              ENVIRONMENT="dev"
              ;;

            *)
              echo "::error::Unable to determine deployment environment."
              exit 1
              ;;
          esac

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Branch      : $BRANCH"
          echo "Environment : $ENVIRONMENT"
          echo "=========================================="


      - name: Validate branch is allowed to deploy to environment
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          BRANCH: ${{ steps.resolve.outputs.branch }}

        shell: bash

        run: |
          set -euo pipefail

          case "$ENVIRONMENT" in

            dev)
              if [[ "$BRANCH" != "dev" && "$BRANCH" != hotfix/* ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to dev."
                exit 1
              fi
              ;;

            staging)
              if [[ "$BRANCH" != "staging" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to staging."
                exit 1
              fi
              ;;

            uat)
              if [[ "$BRANCH" != "uat" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to uat."
                exit 1
              fi
              ;;

            prod)
              if [[ "$BRANCH" != "prod" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to prod."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unsupported environment '$ENVIRONMENT'."
              exit 1
              ;;
          esac

          echo "Branch '$BRANCH' is authorized for environment '$ENVIRONMENT'."


  deploy:
    name: Deploy to ${{ needs.resolve-environment.outputs.environment }}

    needs:
      - resolve-environment

    runs-on: ubuntu-24.04

    # GitHub Environment is selected automatically
    environment:
      name: ${{ needs.resolve-environment.outputs.environment }}

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Display deployment information
        run: |
          echo "Branch      : ${{ needs.resolve-environment.outputs.branch }}"
          echo "Environment : ${{ needs.resolve-environment.outputs.environment }}"

      # Your existing deployment steps go here
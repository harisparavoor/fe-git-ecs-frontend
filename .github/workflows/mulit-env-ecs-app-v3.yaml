name: multi-env-ecs-app-v2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (leave blank to infer from branch)"
        required: false
        type: choice
        options:
          - ""
          - dev
          - staging
          - uat
          - prod

      branch:
        description: "Branch to deploy (defaults to the branch this workflow is run from)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write
  contents: read

# ============================================================================
  # Resolve and validate deployment environment
  # JOB 1: Decide WHICH environment and WHICH branch to deploy, and check
  # the branch is allowed to target that environment. This job has no
  # `environment:` set, so it cannot touch AWS or any deploy secrets.
# ============================================================================
jobs:

  resolve-environment:
    name: Resolve target environment
    runs-on: ubuntu-24.04

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      branch: ${{ steps.resolve.outputs.branch }}

    steps:

      # ----------------------------------------------------------------------
      # Resolve branch and environment
      # ----------------------------------------------------------------------
      - name: Resolve environment and branch
        id: resolve
        shell: bash

        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_BRANCH: ${{ inputs.branch }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}

        run: |
          set -euo pipefail

          BRANCH="${INPUT_BRANCH:-$TRIGGER_REF_NAME}"

          if [[ -z "$BRANCH" ]]; then
            echo "::error::Deployment branch could not be resolved."
            exit 1
          fi

          # ------------------------------------------------------------------
          # Strict branch-name validation.
          #
          # Allowed:
          #   dev
          #   staging
          #   uat
          #   prod
          #   hotfix/*
          #
          # Examples rejected:
          #   DEV
          #   Dev
          #   PROD
          #   Prod
          #   STAGING
          #   Hotfix/123
          # ------------------------------------------------------------------
          case "$BRANCH" in
            dev|staging|uat|prod|hotfix/*)
              ;;
            *)
              echo "::error::Invalid branch name '$BRANCH'."
              echo "::error::Allowed branch names: dev, staging, uat, prod, hotfix/*."
              echo "::error::Branch names and the hotfix prefix must use lowercase."
              exit 1
              ;;
          esac

          # ------------------------------------------------------------------
          # Resolve default environment from branch.
          # Step: Resolve environment and branch
          # ------------------------------------------------------------------
          case "$BRANCH" in
            prod)
              DEFAULT_ENVIRONMENT="prod"
              ;;

            uat)
              DEFAULT_ENVIRONMENT="uat"
              ;;

            staging)
              DEFAULT_ENVIRONMENT="staging"
              ;;

            dev)
              DEFAULT_ENVIRONMENT="dev"
              ;;

            hotfix/*)
              DEFAULT_ENVIRONMENT="dev"
              ;;
          esac

          # ------------------------------------------------------------------
          # Validate manually supplied environment.
          # Environment names must be lowercase.
          # ------------------------------------------------------------------
          if [[ -n "$INPUT_ENVIRONMENT" ]]; then

            case "$INPUT_ENVIRONMENT" in
              dev|staging|uat|prod)
                ENVIRONMENT="$INPUT_ENVIRONMENT"
                ;;

              *)
                echo "::error::Invalid environment name '$INPUT_ENVIRONMENT'."
                echo "::error::Allowed environment names: dev, staging, uat, prod."
                echo "::error::Environment names must be lowercase."
                exit 1
                ;;
            esac

          else
            ENVIRONMENT="$DEFAULT_ENVIRONMENT"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          echo "Resolved branch     : $BRANCH"
          echo "Resolved environment: $ENVIRONMENT"


      # ----------------------------------------------------------------------
      # Validate branch/environment relationship
      # ----------------------------------------------------------------------
      - name: Validate branch is allowed to deploy to environment
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          BRANCH: ${{ steps.resolve.outputs.branch }}

        shell: bash

        run: |
          set -euo pipefail

          case "$ENVIRONMENT" in

            dev)

              # dev accepts:
              #   dev
              #   hotfix/*
              if [[ "$BRANCH" != "dev" && "$BRANCH" != hotfix/* ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to dev."
                echo "::error::Only 'dev' or 'hotfix/*' branches may deploy to dev."
                exit 1
              fi
              ;;

            staging)

              if [[ "$BRANCH" != "staging" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to staging."
                echo "::error::Only the 'staging' branch may deploy to staging."
                exit 1
              fi
              ;;

            uat)

              if [[ "$BRANCH" != "uat" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to uat."
                echo "::error::Only the 'uat' branch may deploy to uat."
                exit 1
              fi
              ;;

            prod)

              if [[ "$BRANCH" != "prod" ]]; then
                echo "::error::Branch '$BRANCH' is not allowed to deploy to prod."
                echo "::error::Only the 'prod' branch may deploy to prod."
                exit 1
              fi
              ;;

            *)

              echo "::error::Unsupported environment '$ENVIRONMENT'."
              exit 1
              ;;

          esac

          echo "Branch '$BRANCH' is authorized for environment '$ENVIRONMENT'."


# ============================================================================
# ECS Deployment
# ============================================================================
  deploy:
    name: Deploy ECS to ${{ needs.resolve-environment.outputs.environment }}

    needs:
      - resolve-environment

    runs-on: ubuntu-24.04

    # GitHub Environment.
    # Configure reviewers/secrets/variables under:
    # Repository -> Settings -> Environments
    environment:
      name: ${{ needs.resolve-environment.outputs.environment }}

    # Prevent simultaneous ECS deployments to the same environment.
    concurrency:
      group: ECS-deploy-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:

      # ======================================================================
      # Validate environment configuration
      # ======================================================================
      - name: Validate required configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          TARGET_ENV: ${{ needs.resolve-environment.outputs.environment }}
        run: |
          set -euo pipefail
          missing=0

          check() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required variable '$name' for environment '$TARGET_ENV'"
              missing=1
            fi
          }
          echo "Validating common infra configuration..."
          check "AWS_REGION"                 "${{ vars.AWS_REGION }}"
          check "ECS_CLUSTER"                "${{ vars.ECS_CLUSTER }}"
          check "ECS_SERVICE"                "${{ vars.ECS_SERVICE }}"
          check "ECS_CONTAINER_NAME"         "${{ vars.ECS_CONTAINER_NAME }}"
          check "ECS_TASK_DEFINITION_FAMILY" "${{ vars.ECS_TASK_DEFINITION_FAMILY }}"
          check "ECR_REPOSITORY"             "${{ vars.ECR_REPOSITORY }}"
          check "AWS_ROLE_ARN"               "${{ secrets.AWS_ROLE_ARN }}"
          check "CLIENTID"                   "${{ vars.REACT_APP_AZURE_AD_CLIENTID }}"
          check "AD_AUTHORITY"               "${{ vars.REACT_APP_AZURE_AD_AUTHORITY }}"
          check "APP_API_URL"                "${{ vars.REACT_APP_API_URL }}"
          check "AD_API_SCOPE"               "${{ vars.REACT_APP_AZURE_AD_API_SCOPE }}"
          check "CHAT_ORIGIN"                "${{ vars.REACT_APP_CHAT_ORIGIN }}"
          check "NOTES_ORIGIN"               "${{ vars.REACT_APP_NOTES_ORIGIN }}"
          check "BACKEND_PORT"                "${{ vars.BACKEND_PORT }}"
          check "ALB_NAME"                    "${{ vars.ALB_NAME }}"  
     
          # Environment-specific configuration.
          case "$TARGET_ENV" in

            prod)
              check "PROD_Env_specific_value" "$PROD_ENV_SPECIFIC_VALUE"
              ;;

            dev)
              check "dev_Env_specific_value" "$DEV_ENV_SPECIFIC_VALUE"
              ;;

            staging)
              check "stage_Env_specific_value" "$STAGING_ENV_SPECIFIC_VALUE"
              ;;

            uat)
              check "uat_Env_specific_value" "$UAT_ENV_SPECIFIC_VALUE"
              ;;

            *)
              echo "::error::Unknown environment '$TARGET_ENV'."
              missing=1
              ;;

          esac

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::One or more required configuration values are missing."
            exit 1
          fi

          echo "All required configuration values are present."


      # ======================================================================
      # Checkout selected branch
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

        with:
          ref: ${{ needs.resolve-environment.outputs.branch }}
          fetch-depth: 0

      # Optional sanity build of the app before containerizing.
      # Remove this step if your Docker build already handles install/build.
      # -----------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "WARNING: No package-lock.json/npm-shrinkwrap.json found."
            echo "Falling back to 'npm install'. Commit a lock file for reproducible, faster CI builds."
            npm install
          fi


      # ======================================================================
      # Render frontend .env
      #
      # IMPORTANT:
      # Values placed into a frontend build become publicly accessible.
      # Do NOT place passwords, client secrets, API keys or other secrets here.
      # ======================================================================
      - name: Render frontend .env
        shell: bash

        env:
          CLIENTID: ${{ vars.REACT_APP_AZURE_AD_CLIENTID }}
          AD_AUTHORITY: ${{ vars.REACT_APP_AZURE_AD_AUTHORITY }}
          APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          AD_API_SCOPE: ${{ vars.REACT_APP_AZURE_AD_API_SCOPE }}
          CHAT_ORIGIN: ${{ vars.REACT_APP_CHAT_ORIGIN }}
          NOTES_ORIGIN: ${{ vars.REACT_APP_NOTES_ORIGIN }}

        run: |
          set -euo pipefail

          test -f ./frontend/.env

          envsubst \
            '${CLIENTID} ${AD_AUTHORITY} ${APP_API_URL} ${AD_API_SCOPE} ${CHAT_ORIGIN} ${NOTES_ORIGIN}' \
            < ./frontend/.env \
            > /tmp/frontend.env

          mv /tmp/frontend.env ./frontend/.env


      # ======================================================================
      # Render nginx configuration
      # ======================================================================
      - name: Render nginx configuration
        shell: bash

        env:
          APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          CHAT_ORIGIN: ${{ vars.REACT_APP_CHAT_ORIGIN }}
          NOTES_ORIGIN: ${{ vars.REACT_APP_NOTES_ORIGIN }}

        run: |
          set -euo pipefail

          test -f ./frontend/nginx.conf

          envsubst \
            '${APP_API_URL} ${CHAT_ORIGIN} ${NOTES_ORIGIN}' \
            < ./frontend/nginx.conf \
            > /tmp/nginx.conf

          mv /tmp/nginx.conf ./frontend/nginx.conf


      # ======================================================================
      # Render authentication configuration
      # ======================================================================
      - name: Render authentication configuration
        shell: bash

        env:
          APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          
          CLIENTID: ${{ vars.REACT_APP_AZURE_AD_CLIENTID }}
          AD_AUTHORITY: ${{ vars.REACT_APP_AZURE_AD_AUTHORITY }}
          AD_API_SCOPE: ${{ vars.REACT_APP_AZURE_AD_API_SCOPE }}

        run: |
          set -euo pipefail

          test -f ./frontend/src/authConfig.ts

          envsubst \
            '${APP_API_URL} ${CLIENTID} ${AD_AUTHORITY} ${AD_API_SCOPE}' \
            < ./frontend/src/authConfig.ts \
            > /tmp/authConfig.ts

          mv /tmp/authConfig.ts ./frontend/src/authConfig.ts

      # ======================================================================
      # Configure AWS credentials using GitHub OIDC
      # ======================================================================
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4

        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}


      # ======================================================================
      # Login to ECR
      # ======================================================================
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================================
      # Get source commit hash
      # ======================================================================
      - name: Get commit hash
        id: get-commit-hash
        shell: bash

        run: |
          set -euo pipefail

          COMMIT_HASH="$(git rev-parse --short=7 HEAD)"

          echo "commit-hash=$COMMIT_HASH" >> "$GITHUB_OUTPUT"

          echo "Source commit: $COMMIT_HASH"

      # Look up the ALB's live DNS name (created by Terraform) and build
      # REACT_APP_BACKEND_URL from it. This can't be a static repo Variable
      # since the DNS name only exists once the ALB is provisioned --
      # it's fetched fresh from AWS on every run instead.
      # -----------------------------------------------------------------
      - name: Resolve backend URL from ALB DNS name
        shell: bash
        run: |
          set -euo pipefail
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{vars.ALB_NAME}}" \
            --query "LoadBalancers[0].DNSName" \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" == "None" ]; then
            echo "::error::Could not resolve DNS name for ALB '${{vars.ALB_NAME}}'. Check ALB_NAME matches the actual load balancer name."
            exit 1
          fi

          echo "Resolved ALB DNS: $ALB_DNS"
          echo "REACT_APP_BACKEND_URL=http://${ALB_DNS}:${BACKEND_PORT}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # Replace placeholder in webpack.config.js with the real backend URL.
      # -----------------------------------------------------------------
      - name: Replace placeholders in webpack.config.js
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REACT_APP_BACKEND_URL:-}" ]; then
            echo "::error::REACT_APP_BACKEND_URL is empty. Check the previous ALB resolution step."
            exit 1
          fi
          sed -i "s|{{REACT_APP_BACKEND_URL}}|$REACT_APP_BACKEND_URL|g" webpack.config.js
          echo "webpack.config.js after replacement:"
          cat webpack.config.js

      # ======================================================================
      # Build and push Docker image
      # ======================================================================
      - name: Build, tag and push image to Amazon ECR
        id: build-image
        shell: bash

        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

          COMMIT_HASH: ${{ steps.get-commit-hash.outputs.commit-hash }}

        run: |
          set -euo pipefail

          REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          IMAGE_TAG="${ENVIRONMENT}-${COMMIT_HASH}"

          echo "Repository : $REPOSITORY_URI"
          echo "Image tag  : $IMAGE_TAG"

          docker build \
            -build-arg REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" \
            -t "$REPOSITORY_URI:$IMAGE_TAG" .

          docker push "$REPOSITORY_URI:$IMAGE_TAG"

          # Resolve the immutable ECR digest.
          IMAGE_DIGEST="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text
          )"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "::error::Unable to resolve ECR image digest for '$IMAGE_TAG'."
            exit 1
          fi

          # Deploy using digest instead of mutable tag.
          IMAGE_URI="${REPOSITORY_URI}@${IMAGE_DIGEST}"

          echo "Immutable image URI: $IMAGE_URI"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # ======================================================================
      # Download current ECS task definition
      # ======================================================================
      - name: Download current ECS task definition
        shell: bash

        env:
          ECS_TASK_DEFINITION_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY }}

        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query "taskDefinition" \
            --output json \
            > task-definition.json

          test -s task-definition.json

          echo "Task definition downloaded successfully."


      # ======================================================================
      # Update only the specified container image.
      #
      # The container is identified by ECS_CONTAINER_NAME and its image is
      # replaced with the newly built immutable ECR image URI.
      # ======================================================================
      - name: Update image in task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1

        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image_uri }}

      # ======================================================================
      # Deploy updated ECS task definition
      # ======================================================================
      - name: Deploy new task definition to ECS
        id: deploy-ecs
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2

        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      # ======================================================================
      # Deployment summary
      # ======================================================================
      - name: Deployment summary
        shell: bash

        env:
          ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
          BRANCH: ${{ needs.resolve-environment.outputs.branch }}

        run: |
          {
            echo "## ECS Deployment"
            echo ""
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Branch: \`$BRANCH\`"
            echo "- Deployment: successful"
          } >> "$GITHUB_STEP_SUMMARY"
